
<section class="section contact" id="contact">
  <div class="container contact-grid">

    <div class="contact-content">
      <span class="section-label">UN PROJET EN TÊTE ?</span>

      <h2 class="section-title">
        Créons quelque<br />
        chose de <em>beau.</em>
      </h2>

      <p>
        Vous avez une idée, un projet ou simplement besoin
        de conseils pour votre présence digitale ?
        Parlons-en.
      </p>

      <a href="mailto:adeline02025@gmail.com" class="contact-email">
        adeline02025@gmail.com ↗
      </a>

      <div class="contact-social">
        <span>FRANCE</span>
        <span>·</span>
        <span>À DISTANCE</span>
      </div>
    </div>

    <div class="contact-card">
      <h3>Parlons de votre projet</h3>
      <p>Écrivez-moi, je vous répondrai avec plaisir.</p>

      <form #contactForm="ngForm"
            (ngSubmit)="enviarCorreo(contactForm)">

        <label for="nom">Votre nom</label>
        <input
          id="nom"
          type="text"
          name="Nom"
          ngModel
          placeholder="Nom et prénom"
          required
        />

        <label for="email">Votre e-mail</label>
        <input
          id="email"
          type="email"
          name="Email"
          ngModel
          placeholder="Adresse e-mail"
          required
        />

        <label for="projet">Votre projet</label>
        <select id="projet" name="Projet" ngModel required>
          <option value="">Choisissez un service</option>
          <option>Création de site web</option>
          <option>Design digital</option>
          <option>Solutions digitales</option>
          <option>Autre projet</option>
        </select>

        <label for="message">Votre message</label>
        <textarea
          id="message"
          name="Message"
          ngModel
          rows="4"
          placeholder="Parlez-moi de votre projet..."
          required
        ></textarea>

        <button
          type="submit"
          class="btn-primary"
          [disabled]="contactForm.invalid">
          Envoyer mon message ↗
        </button>

      </form>
    </div>

  </div>
</section>
