
<section class="section contact" id="contact">
  <div class="container contact-grid">

    <div class="contact-content">
      <span class="section-label">UN PROJET EN TÊTE ?</span>

      <h2 class="section-title">
        Créons quelque<br />
        chose de <em>beau.</em>
      </h2>

      <p>
        Vous avez une idée, un projet ou simplement besoin
        de conseils pour votre présence digitale ?
        Parlons-en.
      </p>

      <a href="mailto:adeline02025@gmail.com" class="contact-email">
        adeline02025@gmail.com ↗
      </a>

      <div class="contact-social">
        <span>FRANCE</span>
        <span>·</span>
        <span>À DISTANCE</span>
      </div>
    </div>

    <div class="contact-card">
      <h3>Parlons de votre projet</h3>
      <p>Écrivez-moi, je vous répondrai avec plaisir.</p>

      <form action="mailto:contact@ruthdigitalstudio.fr"
            method="post"
            enctype="text/plain">

        <label>Votre nom</label>
        <input type="text" name="Nom" placeholder="Nom et prénom" required />

        <label>Votre e-mail</label>
        <input type="email" name="Email" placeholder="Adresse e-mail" required />

        <label>Votre projet</label>
        <select name="Projet">
          <option value="">Choisissez un service</option>
          <option>Création de site web</option>
          <option>Design digital</option>
          <option>Solutions digitales</option>
          <option>Autre projet</option>
        </select>

        <label>Votre message</label>
        <textarea name="Message" rows="4"
                  placeholder="Parlez-moi de votre projet..." required></textarea>

        <button type="submit" class="btn-primary">
          Envoyer mon message ↗
        </button>

      </form>
    </div>

  </div>
</section>
